[project]
name = "samplingbias"
version = "0.1.0"
description = "A project for modeling and correcting sampling bias in statistical analyses."
requires-python = ">=3.11"
dependencies = [
    "bayesflow",
    "cmdstanpy>=1.3.0",
    "ipykernel>=7.1.0",
    "jax>=0.9.0",
    "joblib>=1.5.3",
    "rpy2>=3.6.4",
    "tensorflow>=2.20.0",
]

[tool.uv.sources]
bayesflow = { git = "https://github.com/bayesflow-org/bayesflow.git", rev = "attention_refactor" }
